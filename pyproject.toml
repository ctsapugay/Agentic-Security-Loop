[project]
name = "policyforge"
version = "0.1.0"
description = "Automated hardening of AI agents with deterministic security policies"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agentdojo==0.1.35",
    "anthropic>=0.50",
    "openai>=1.59.7",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "z3-solver>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyforge"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
