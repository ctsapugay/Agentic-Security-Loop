[project]
name = "policyforge"
version = "0.1.0"
description = "Automated hardening of AI agents with deterministic security policies"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agentdojo==0.1.35",
    "anthropic>=0.50",
    "openai>=1.59.7",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "z3-solver>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # CaMeL runtime (Apache-2.0), pinned to the audited commit
    "camel @ git+https://github.com/google-research/camel-prompt-injection@f083b6b396399d3b3c7f2ddaf613a5945eaf32d8",
    "pydantic-ai==0.2.12",
    "opentelemetry-api==1.33.1",  # pydantic-ai 0.2.12 needs opentelemetry._events
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/policyforge"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
