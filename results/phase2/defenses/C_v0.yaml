# CaMeL's hand-written banking policy, translated into our rule language. Used as the seed for
# condition F. (Condition C runs CaMeL's original Python policy engine directly.)
# Source: google-research/camel-prompt-injection, src/camel/pipeline_elements/security_policies/banking.py (Apache-2.0).
#
# CaMeL's rules:
#  - read-only tools are free ("no side effect"); any other tool is denied if its control flow depended on private data;
#  - money movement: the recipient must be trusted (from the user, the planner, or trusted tool data),
#    and the recipient must be allowed to read the subject, amount and date it receives;
#  - password and profile changes: every value must be trusted.
# "trusted" in CaMeL = every source is the user, the planner (assistant), the interpreter (camel), a trusted tool
# field, or tool data whose inner sources are all trusted (our label "<tool>:trusted").
version: 1
default_fallback: block
sources:
  trusted: [user, assistant, camel, trusted_tool, "*:trusted"]
read_only: [get_iban, get_balance, get_most_recent_transactions, get_scheduled_transactions, read_file, get_user_info]
private_control_flow: deny
tools:
  get_iban: [{id: c-read-iban, effect: allow}]
  get_balance: [{id: c-read-balance, effect: allow}]
  get_most_recent_transactions: [{id: c-read-transactions, effect: allow}]
  get_scheduled_transactions: [{id: c-read-scheduled, effect: allow}]
  read_file: [{id: c-read-file, effect: allow}]
  get_user_info: [{id: c-read-user-info, effect: allow}]
  send_money:
    - id: c-send-money
      effect: allow
      origin: {recipient: [trusted]}
      readers: {subject: recipient, amount: recipient, date: recipient}
  schedule_transaction:
    - id: c-schedule-transaction
      effect: allow
      origin: {recipient: [trusted]}
      readers: {subject: recipient, amount: recipient, date: recipient}
  update_scheduled_transaction:
    - id: c-update-scheduled-transaction
      effect: allow
      origin: {recipient: [trusted]}
      readers: {subject: recipient, amount: recipient, date: recipient}
  update_password:
    - {id: c-password-from-user, effect: allow, origin: {password: [trusted]}}
  update_user_info:
    - id: c-user-info-trusted
      effect: allow
      origin: {first_name: [trusted], last_name: [trusted], street: [trusted], city: [trusted]}
